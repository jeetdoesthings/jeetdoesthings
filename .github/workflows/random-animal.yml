name: Update Random Animal Fact

on:
  schedule:
    - cron: '0 0 * * *'   # once a day at midnight UTC
  workflow_dispatch:        # manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  update-fact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Pick a random fact and update README
        run: python3 .github/scripts/update_fact.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md .github/scripts/used_facts.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update random animal fact"
          git push